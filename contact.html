<section class="section">
  <div class="container">

    <div class="section-head">
      <h2>Request Your Custom Holiday</h2>
      <p>
        Share your travel plans and our team can help create your ideal journey.
      </p>
    </div>

    <form class="form demo-form" id="enquiryForm">

      <input
        type="text"
        id="full_name"
        name="full_name"
        placeholder="Full Name"
        required
      >

      <input
        type="tel"
        id="phone_number"
        name="phone_number"
        placeholder="Phone Number"
        required
      >

      <input
        type="email"
        id="email"
        name="email"
        placeholder="Email Address"
        required
      >

      <input
        type="text"
        id="destination"
        name="destination"
        placeholder="Destination"
      >

      <input
        type="date"
        id="travel_date"
        name="travel_date"
      >

      <input
        type="text"
        id="travelers"
        name="travelers"
        placeholder="Number of Travelers"
      >

      <input
        type="text"
        id="budget_range"
        name="budget_range"
        placeholder="Budget Range"
      >

      <textarea
        id="message"
        name="message"
        placeholder="Tell us about your dream holiday"
      ></textarea>

      <button
        type="submit"
        class="btn btn-gold full"
      >
        REQUEST A CUSTOM HOLIDAY
      </button>

      <p class="form-message hidden full"></p>

    </form>

    <div class="notice">
      Submit your holiday enquiry and our team will get in touch with you shortly.
    </div>

  </div>
</section>
